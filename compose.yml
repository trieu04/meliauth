name: meliauth

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: meliauth-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${APP_PUBLISHED_PORT:-3000}:3000"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/$${API_PREFIX:-api/v1}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-meliauth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meliauth}
      POSTGRES_DB: ${DB_NAME:-meliauth}
    ports:
      - "${DB_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - meliauth_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meliauth_postgres:
